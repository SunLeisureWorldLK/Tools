<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <div id="out-days">{{ state.days.length }}</div>
        <div id="out-dep">{{ state.texts.flightDeparture }}</div>
    </div>
    <script>
        const { createApp, reactive, onMounted } = Vue;
        createApp({
            setup() {
                const state = reactive({
                    texts: { flightDeparture: 'DEFAULT_DEP' },
                    days: [ { id: 1 }, { id: 2 } ]
                });

                onMounted(() => {
                    const importedData = {
                        state: {
                            texts: { flightDeparture: 'IMPORTED_DEP' },
                            days: []
                        }
                    };
                    // what if days is empty in imported data?
                    Object.assign(state, importedData.state);
                    console.log("Vue updated");
                });

                return { state };
            }
        }).mount('#app');
    </script>
</body>

<!-- Mobile Friendly Home Button v4 -->
<style>
